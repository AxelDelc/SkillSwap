services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skillswap
      POSTGRES_PASSWORD: skillswap
      POSTGRES_DB: skillswap
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillswap"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://skillswap:skillswap@db:5432/skillswap
      - SESSION_SECRET=changeme_in_production
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ./routes
          target: /app/routes
        - action: sync+restart
          path: ./views
          target: /app/views
        - action: sync+restart
          path: ./public
          target: /app/public
        - action: sync+restart
          path: ./middleware
          target: /app/middleware
        - action: sync+restart
          path: ./lib
          target: /app/lib
        - action: sync+restart
          path: ./app.js
          target: /app/app.js
        - action: rebuild
          path: ./package.json

volumes:
  postgres_data:
